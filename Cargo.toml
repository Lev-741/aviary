[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/cli",
    "crates/desktop",
]
default-members = [
    "crates/core",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Levi Burau"]
license = "MIT"
repository = "https://github.com/Lev-741/aviary"
description = "AI Agent System built exclusively for Colibri"
readme = "README.md"

[workspace.dependencies]
aviary-core = { path = "crates/core" }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"

# HTTP Client (for Colibri API)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

# Error Handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Telegram
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }

# Discord
serenity = { version = "0.12", default-features = false, features = ["builder", "cache", "client", "gateway", "model", "rustls_backend"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Config
dotenvy = "0.15"

# Tauri
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

# Testing
wiremock = "0.6"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
