[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/desktop",
    "crates/telegram",
    "crates/discord",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Levi Burau"]
license = "MIT"
repository = "https://github.com/deinusername/aviary"
description = "AI Agent System built exclusively for Colibri"
readme = "README.md"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }

# Web
axum = "0.8"
tower = "0.5"
tower-http = "0.6"

# HTTP Client (for Colibri API)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Error Handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Telegram
teloxide = "0.13"

# Discord
serenity = "0.12"

# CLI
clap = { version = "4", features = ["derive"] }

# Config
dotenvy = "0.15"

# Tauri
tauri = "2"
tauri-build = "2"

# Desktop UI (shared types)
serde.workspace = true
